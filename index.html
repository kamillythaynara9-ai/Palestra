<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eu Poderia Ter Me Tornado Amarga · Lutando pelo Futuro</title>
<meta name="description" content="Palestra de Jennifer Mayara Martins no Projeto Lutando pelo Futuro.">
<meta property="og:title" content="Eu poderia ter me tornado amarga, mas escolhi amar">
<meta property="og:description" content="Palestra de Jennifer Mayara Martins no Projeto Lutando pelo Futuro.">
<meta property="og:image" content="assets/img/logo.png">
<meta name="theme-color" content="#0A1519">
<link rel="icon" href="assets/img/logo.png">
<!-- reserva online: as mesmas fontes do Google Fonts (as locais em assets/fontes têm prioridade) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat+Brush&family=Kalam:wght@400;700&family=Nunito:ital,wght@0,400;0,700;0,800;1,400&display=block">
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>
<main id="palco" aria-label="Apresentação da palestra">
  <canvas id="fundo" aria-hidden="true"></canvas>
  <div id="slides"></div>
  <div id="hud" class="oculto" aria-hidden="true">
    <img class="hud-logo" src="assets/img/logo.webp" alt="">
    <div class="hud-round" id="hud-round"></div>
    <div class="hud-corda" id="hud-corda"><svg viewBox="0 0 40 40"><path d="M20 35 C 8 26 3 20 3 13 C 3 7 7 3 12 3 C 16 3 18 6 20 9 C 22 6 24 3 28 3 C 33 3 37 7 37 13 C 37 20 32 26 20 35 Z" fill="#EF4A5A" stroke="#F4ECDD" stroke-width="2.5"/></svg></div>
  </div>
  <div id="cortina" aria-hidden="true">
    <div class="rc-faixa"></div>
    <div class="rc-conteudo">
      <div class="rc-linha">
        <svg class="rc-sino" viewBox="0 0 100 100"><rect x="45" y="4" width="10" height="12" rx="4" fill="#F4ECDD"/><path d="M50 12 C 28 12 21 32 21 52 L 13 74 L 87 74 L 79 52 C 79 32 72 12 50 12 Z" fill="#F4ECDD"/><circle cx="50" cy="84" r="9" fill="#F4ECDD"/></svg>
        <span class="rc-round">ROUND</span><span class="rc-num">01</span>
      </div>
      <p class="rc-titulo"></p>
    </div>
  </div>
  <div id="pausa"><img src="assets/img/logo.webp" alt="Projeto Lutando pelo Futuro"><p>Lutando pelo Futuro</p></div>
  <div id="grao" aria-hidden="true"></div>
</main>

<div id="notas" role="region" aria-label="Notas de apresentação"></div>
<nav id="grade" aria-label="Todos os slides"></nav>
<button id="botao-som" type="button" aria-pressed="false">Som: desligado</button>
<div id="dica"><kbd>→</kbd> avança · <kbd>←</kbd> volta · <kbd>F</kbd> tela cheia · <kbd>N</kbd> notas · <kbd>G</kbd> todos os slides · <kbd>S</kbd> som do gongo · <kbd>B</kbd> pausa</div>

<script>
  /* grão de filme gerado na hora (sem arquivo extra) */
  (function () {
    var c = document.createElement("canvas"); c.width = c.height = 180;
    var x = c.getContext("2d"), d = x.createImageData(180, 180);
    for (var i = 0; i < d.data.length; i += 4) { var v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
    x.putImageData(d, 0, 0);
    document.getElementById("grao").style.backgroundImage = "url(" + c.toDataURL() + ")";
  })();
</script>
<script src="js/slides.js"></script>
<script src="js/fundo.js"></script>
<script src="js/apresentacao.js"></script>
</body>
</html>
